# Workflow derived from https://github.com/r-wasm/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: R Wasm & pkgdown deploy

jobs:
  build-site:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYLIVE_ASSETS_VERSION: 0.10.8
      WEBR_IMAGE: v0.5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Usual steps for generating a pkgdown website
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Install dev shinylive
        shell: Rscript {0}
        run: |
          pak::pak("posit-dev/r-shinylive")

      # Build slide decks in inst/slides. Eventually this should also update
      # _pkgdown.yml
      - name: Build slides
        shell: Rscript {0}
        run: |
          source_dir <- "inst/slides"
          dest_dir <- "pkgdown/assets"
          fs::dir_copy(source_dir, dest_dir, overwrite = TRUE)
          slide_qmds <- fs::dir_ls(dest_dir, glob = "*.qmd")
          for (qmd_file in slide_qmds) {
            file_base <- fs::path_ext_remove(fs::path_file(qmd_file))
            output_file <- paste0("slides-", file_base, ".html")
            quarto::quarto_render(qmd_file, output_file = output_file)
          }
          fs::file_delete(slide_qmds)

      # Change the build directory to `_site`
      - name: Build site
        shell: Rscript {0}
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = FALSE,
            dest_dir = "_site"
          )

      # Build the local R package and structure the CRAN repository
      - name: Build Wasm R packages
        uses: r-wasm/actions/build-rwasm@v2
        with:
          webr-image: ghcr.io/r-wasm/webr:${{ env.WEBR_IMAGE }}
          packages: "."
          repo-path: "_site"

      # Upload an artifact that will work with GitHub Pages
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build-site]
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
